version: 1.3.0
homepage: https://sdk.sellwild.com
repository: https://github.com/Antengo/sellwild-sdk

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.4.0
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  # No platform-specific assets required — all ad delivery is web-based.

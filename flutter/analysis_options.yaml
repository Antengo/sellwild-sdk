# Lints for the Sellwild Flutter SDK and its tests.
#
#   cd flutter && flutter analyze --fatal-infos --fatal-warnings
#
# flutter analyze has no baseline file, so the tree is kept at zero findings:
# any finding fails the gate.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - coverage/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # House failure rules (contracts/FAILURES.md sections 1-2).
    #
    # flutter analyze passes three house-rule breaks that the print gate
    # (contracts/scripts/print-gate.mjs, the gate's print-gate step) fails,
    # so the print gate is the check for them:
    #   a. `catch (_) {}`: empty_catches lets a catch named _ be empty;
    #   b. a catch body that holds only a comment: empty_catches lets it
    #      through, the house rule counts it as empty (FAILURES.md 1.3);
    #   c. debugPrint in lib/: avoid_print covers dart:core print only.
    # Neither tool sees a print called through an import prefix
    # (`import 'dart:core' as core; core.print(...)`), nor checks that every
    # catch calls logFailure: code review and the coverage tests carry that.
    #
    # 1. avoid_print. The A2 debug logger (lib/src/failures/sellwild_log.dart)
    #    turns it off for itself with a reason, as the print gate exempts it.
    - avoid_print
    # 2. An empty catch body (see a and b above).
    - empty_catches
    # 3. Silent swallows: a future nobody awaits, an async function nobody
    #    can await, a finally that hides the exception.
    - unawaited_futures
    - avoid_void_async
    - control_flow_in_finally
    - throw_in_finally
    - use_rethrow_when_possible

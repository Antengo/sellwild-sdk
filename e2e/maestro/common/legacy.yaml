# Legacy: the deprecated WebView widget, on its own screen. Only the
# container is asserted: what the WebView draws is not part of the contract.
appId: ${APP_ID}
---
- tapOn:
    id: "sw.tab.legacy"
- extendedWaitUntil:
    visible:
      id: "sw.legacy.title"
      text: "Legacy WebView widget \\(deprecated\\)"
    timeout: 15000
- assertVisible:
    id: "sw.legacy.webview"
- waitForAnimationToEnd:
    timeout: 10000
- runFlow: no-crash.yaml
- takeScreenshot: legacy

// React Native Android module for @sellwild/react-native-sdk.
//
// Hosts the SellwildBannerView component manager that bridges the JS
// <SellwildBanner> to the native com.sellwild.sdk.SellwildAdView (which
// runs a Prebid Mobile auction and renders into AdManagerAdView).

buildscript {
    ext.getExtOrDefault = { name, defaultValue ->
        return rootProject.ext.has(name) ? rootProject.ext.get(name) : defaultValue
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:8.7.3"
        // Default to Kotlin 1.9.22 — matches RN 0.74's bundled toolchain.
        // Host apps that pin a newer Kotlin via `ext.kotlinVersion` in their
        // root build.gradle override this. We intentionally do NOT default
        // to 2.1.x here: when the host's compiler is 1.9 (RN 0.74 default),
        // a 2.1 stdlib on the classpath causes "incompatible metadata"
        // errors compiling these bridge sources.
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion', '1.9.22')}"
    }
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
    namespace "com.sellwild.rnsdk"
    compileSdk safeExtGet("compileSdkVersion", 35)

    defaultConfig {
        minSdk safeExtGet("minSdkVersion", 23)
        targetSdk safeExtGet("targetSdkVersion", 35)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
        // Pin to 1.9 so the bridge sources are always compilable by the
        // host's Kotlin compiler. Bridge code uses only 1.9-compatible
        // idioms (no data objects, no context receivers, no 2.0-only
        // language features). Verified safe.
        apiVersion = "1.9"
        languageVersion = "1.9"
    }
}

// Repositories are intentionally not declared here. Downstream React Native
// apps that consume @sellwild/react-native-sdk via npm autolinking declare
// both `https://maven.sellwild.com/releases` and `mavenLocal()` in their
// `allprojects { repositories { ... } }` block (see the README).
//
// Inside the SDK monorepo (samples/demo-app), the SDK is published to
// mavenLocal first so the demo-app's Kotlin 1.9 classpath can consume the
// AAR without inheriting the SDK's Kotlin 2.1 toolchain.

dependencies {
    // RN libraries are linked against the host app's React Native install,
    // so we depend on it as compileOnly. The host app provides the runtime
    // classes via its own `react-native` node_modules.
    compileOnly "com.facebook.react:react-android"

    // The native SDK that owns SellwildAdView, SellwildPrebidMobile, etc.
    // Resolves to the published AAR off https://maven.sellwild.com/releases
    // for npm consumers, or to mavenLocal in the SDK monorepo dev workflow.
    implementation "com.sellwild:sdk:1.3.5"
}

// Force kotlin-stdlib down to the bridge's declared Kotlin version. The
// SDK AAR (com.sellwild:sdk) is compiled with Kotlin 2.1.20 and its POM
// declares kotlin-stdlib:2.1.20 as a runtime dep. Gradle's "highest
// version wins" conflict resolution would then upgrade the entire
// classpath to stdlib 2.1.20 — which the host RN 0.74 compiler (Kotlin
// 1.9) cannot read ("incompatible metadata: 2.1.0 > 2.0.0"). The SDK's
// classes were emitted with apiVersion=1.9 + languageVersion=1.9 +
// -Xskip-metadata-version-check, so the older stdlib at runtime is safe.
configurations.all {
    resolutionStrategy {
        def kv = getExtOrDefault('kotlinVersion', '1.9.22')
        force "org.jetbrains.kotlin:kotlin-stdlib:${kv}"
        force "org.jetbrains.kotlin:kotlin-stdlib-common:${kv}"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:${kv}"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:${kv}"
    }
}

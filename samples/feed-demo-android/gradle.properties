# The same heap as android/gradle.properties, so one Gradle daemon serves both
# builds (publish the SDK, then build the sample) on a small machine.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Compile Kotlin inside the Gradle daemon, not in a second JVM.
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

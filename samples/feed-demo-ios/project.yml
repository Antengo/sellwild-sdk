# Sellwild Sample (iOS): the native sample app and the target of the iOS
# Maestro flows (e2e/maestro/ios). Regenerate the committed project after
# editing this file:
#
#   cd samples/feed-demo-ios && xcodegen generate
name: SellwildSample
options:
  bundleIdPrefix: com.sellwild
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
packages:
  SellwildSDK:
    path: ../../
targets:
  SellwildSample:
    type: application
    platform: iOS
    sources:
      - path: SellwildSample
    dependencies:
      - package: SellwildSDK
        product: SellwildSDK
    info:
      path: SellwildSample/Info.plist
      properties:
        CFBundleDisplayName: Sellwild Sample
        CFBundleShortVersionString: "1.0"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        GADApplicationIdentifier: ca-app-pub-3940256099942544~1458002511
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        SKAdNetworkItems: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sellwild.sample
        PRODUCT_NAME: SellwildSample
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
schemes:
  SellwildSample:
    build:
      targets:
        SellwildSample: all
    run:
      config: Debug
    archive:
      config: Release

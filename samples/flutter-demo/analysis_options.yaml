# Lints for the Flutter sample: the SDK's own rules (flutter_lints, strict
# casts, inference and raw types, and the house failure rules), included from
# the SDK so the two cannot drift.
#
#   cd samples/flutter-demo && flutter analyze --fatal-infos --fatal-warnings
include: ../../flutter/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**

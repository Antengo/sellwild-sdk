# A 2 GB Gradle heap (the template asks for 8 GB), with Kotlin compiled in the
# Gradle process: the sample builds on a 16 GB machine next to an emulator.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

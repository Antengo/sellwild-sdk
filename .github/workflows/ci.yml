name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: core (typecheck + smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: core/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:smoke

  react-native:
    name: react-native (tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-native/package-lock.json
      # --legacy-peer-deps: npm 10 re-validates peers during `npm ci` and
      # rejects the lockfile (react-native@latest wants @types/react@19 while
      # devDeps pin @types/react@18). Legacy peer resolution installs exactly
      # what the lockfile lists.
      # RN depends on the core version being released alongside it, which
      # isn't on npm until the release (core publishes first; see
      # RELEASING.md). Point it at the in-repo core for CI only; tsc resolves
      # core from ../core/src via tsconfig paths anyway. `npm install` (not
      # `ci`) because the swapped spec no longer matches the lockfile.
      - run: npm pkg set "dependencies.@sellwild/sdk-core=file:../core"
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npx tsc --noEmit -p .

  dashboard:
    name: dashboard (tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .

  ios:
    name: ios (xcodebuild build + test)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # GoogleMobileAds 12.x+ requires Xcode 16+.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: xcodebuild -version
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            .build/spm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme SellwildSDK \
            -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath .build/spm \
            -derivedDataPath .build/dd
      - name: Pick simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in data if ".SimRuntime.iOS-" in k),
                       key=lambda k: [int(p) for p in k.rsplit("iOS-", 1)[1].split("-")],
                       reverse=True)
          for rt in ios:
              for d in data[rt]:
                  if d.get("isAvailable") and d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit(0)
          sys.exit("no available iPhone simulator")
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID"
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme SellwildSDK \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -clonedSourcePackagesDirPath .build/spm \
            -derivedDataPath .build/dd

  android:
    name: android (unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Caches ~/.gradle and validates the committed wrapper jar.
      - uses: gradle/actions/setup-gradle@v4
      # The Prebid fork resolves from maven.sellwild.com (settings.gradle.kts).
      - run: ./gradlew testDebugUnitTest --stacktrace

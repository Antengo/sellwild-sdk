name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly full run of every job (06:17 UTC), so a platform no PR touched
    # still gets checked against fresh runners and dependencies.
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every platform runs its full unit suite with coverage, writes
# coverage-summary/<platform>.json with the repo's own scripts
# (scripts/coverage/*, the same ones `bash scripts/gate.sh --full` runs), and
# fails below its minimums in tools/coverage-thresholds.json
# (node tools/coverage-gate.mjs). The summary is checked fresh: the committed
# copy is deleted first, so a run that writes none fails as "missing".
#
# Per-platform runs: on pull_request the `changes` job (dorny/paths-filter,
# from the PR's file list) decides which platform jobs run; a job whose paths
# did not change is skipped by its job-level `if:` and shows as skipped. On
# push to main, the nightly schedule and workflow_dispatch every job runs.
# `contracts` always runs (it is quick and its print gate scans every
# platform's sources).
#
#   ios           ios/**, Package.swift, Package.resolved, SellwildSDK.podspec
#   android       android/**
#   core          core/**
#   react-native  react-native/**, core/**
#   dashboard     dashboard/**
#   all of them   contracts/**, tools/coverage*, scripts/coverage/**, .github/workflows/**

jobs:
  changes:
    name: changes (which platforms run)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ios: ${{ github.event_name != 'pull_request' || steps.filter.outputs.ios == 'true' }}
      android: ${{ github.event_name != 'pull_request' || steps.filter.outputs.android == 'true' }}
      core: ${{ github.event_name != 'pull_request' || steps.filter.outputs.core == 'true' }}
      react-native: ${{ github.event_name != 'pull_request' || steps.filter.outputs.react-native == 'true' }}
      dashboard: ${{ github.event_name != 'pull_request' || steps.filter.outputs.dashboard == 'true' }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            everything: &everything
              - 'contracts/**'
              - 'tools/coverage*'
              - 'scripts/coverage/**'
              - '.github/workflows/**'
            ios:
              - *everything
              - 'ios/**'
              - 'Package.swift'
              - 'Package.resolved'
              - 'SellwildSDK.podspec'
            android:
              - *everything
              - 'android/**'
            core:
              - *everything
              - 'core/**'
            react-native:
              - *everything
              - 'core/**'
              - 'react-native/**'
            dashboard:
              - *everything
              - 'dashboard/**'
      - name: Platforms that run
        run: |
          echo "event=${{ github.event_name }}"
          echo "ios=${{ github.event_name != 'pull_request' || steps.filter.outputs.ios == 'true' }}"
          echo "android=${{ github.event_name != 'pull_request' || steps.filter.outputs.android == 'true' }}"
          echo "core=${{ github.event_name != 'pull_request' || steps.filter.outputs.core == 'true' }}"
          echo "react-native=${{ github.event_name != 'pull_request' || steps.filter.outputs.react-native == 'true' }}"
          echo "dashboard=${{ github.event_name != 'pull_request' || steps.filter.outputs.dashboard == 'true' }}"

  contracts:
    name: contracts (node --test, validate, print gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm --prefix contracts ci --no-audit --no-fund
      - name: Contract files against their schemas
        run: node contracts/scripts/validate.mjs
      - name: Contracts tests (node --test)
        run: npm --prefix contracts test
      - name: Print gate (FAILURES.md section 11)
        run: node contracts/scripts/print-gate.mjs
      - name: Coverage gate tool tests
        run: node --test tools/coverage-gate.test.mjs

  core:
    name: core (typecheck, smoke, unit tests + coverage)
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 22: scripts/coverage/ts.mjs loads vitest.config.ts with Node's type stripping.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: core/package-lock.json
      - run: npm --prefix core ci --no-audit --no-fund
      - run: npm --prefix core run typecheck
      - run: npm --prefix core run test:smoke
      - name: Unit tests with coverage
        run: |
          rm -f coverage-summary/core.json
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/coverage/ts.mjs --run --only core
      - name: Coverage gate
        run: node tools/coverage-gate.mjs --only core
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-core
          path: |
            coverage-summary/core.json
            core/coverage/
          if-no-files-found: ignore

  react-native:
    name: react-native (tsc, unit tests + coverage)
    needs: changes
    if: needs.changes.outputs.react-native == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react-native/package-lock.json
      # --legacy-peer-deps: npm 10 re-validates peers during `npm ci` and
      # rejects the lockfile (react-native@latest wants @types/react@19 while
      # devDeps pin @types/react@18). Legacy peer resolution installs exactly
      # what the lockfile lists.
      # RN depends on the core version being released alongside it, which
      # isn't on npm until the release (core publishes first; see
      # RELEASING.md). Point it at the in-repo core for CI only; tsc and the
      # tests resolve core from ../core/src anyway. `npm install` (not `ci`)
      # because the swapped spec no longer matches the lockfile.
      - working-directory: react-native
        run: |
          npm pkg set "dependencies.@sellwild/sdk-core=file:../core"
          npm install --legacy-peer-deps --no-audit --no-fund
      - working-directory: react-native
        run: npx tsc --noEmit -p .
      - name: Unit tests with coverage
        run: |
          rm -f coverage-summary/react-native.json
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/coverage/ts.mjs --run --only react-native
      - name: Coverage gate
        run: node tools/coverage-gate.mjs --only react-native
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-react-native
          path: |
            coverage-summary/react-native.json
            react-native/coverage/
          if-no-files-found: ignore

  dashboard:
    name: dashboard (tsc)
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .

  ios:
    name: ios (unit tests + coverage)
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # One build: scripts/coverage/ios.sh runs a single `xcodebuild test
      # -enableCodeCoverage YES` into this derived data. CI skips the index
      # store, which only an IDE reads.
      SELLWILD_IOS_DERIVED_DATA: ${{ github.workspace }}/.coverage-tmp/ios-dd
      SELLWILD_IOS_XCODEBUILD_ARGS: COMPILER_INDEX_STORE_ENABLE=NO
    steps:
      - uses: actions/checkout@v4
      # GoogleMobileAds 12.x+ requires Xcode 16+.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      # Boot the simulator now, so it boots while the packages and the build run.
      - name: Boot simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in data if ".SimRuntime.iOS-" in k),
                       key=lambda k: [int(p) for p in k.rsplit("iOS-", 1)[1].split("-")],
                       reverse=True)
          for rt in ios:
              for d in data[rt]:
                  if d.get("isAvailable") and d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit(0)
          sys.exit("no available iPhone simulator")
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID"
          xcrun simctl boot "$UDID"
      # The runner's own Node runs ios.sh's summary and the contract checks;
      # setup-node took over 3 minutes here on macOS.
      - run: node --version
      # ios.sh validates the payloads the tests emit with contracts/scripts/validate.mjs.
      - run: npm --prefix contracts ci --no-audit --no-fund
      # Derived data: the resolved packages and their build products. Keyed on
      # the package manifest, the Xcode version and the Swift sources; a
      # source change restores the newest cache for the same manifest, so only
      # this repo's code rebuilds.
      - name: Xcode version
        id: xcode
        run: echo "version=$(xcodebuild -version | tr '\n' ' ' | tr -cs 'A-Za-z0-9.' '-')" >> "$GITHUB_OUTPUT"
      - name: Restore derived data
        uses: actions/cache/restore@v4
        with:
          path: .coverage-tmp/ios-dd
          key: ios-dd-v1-${{ steps.xcode.outputs.version }}-${{ hashFiles('Package.swift') }}-${{ hashFiles('ios/**/*.swift') }}
          restore-keys: ios-dd-v1-${{ steps.xcode.outputs.version }}-${{ hashFiles('Package.swift') }}-
      - name: Wait for simulator
        run: xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b
      - name: Unit tests with coverage
        env:
          SELLWILD_IOS_SIM_ID: ${{ steps.sim.outputs.udid }}
        run: |
          rm -f coverage-summary/ios.json
          bash scripts/coverage/ios.sh
      - name: Coverage gate
        run: node tools/coverage-gate.mjs --only ios
      - name: Save derived data
        if: always() && steps.xcode.outputs.version != ''
        uses: actions/cache/save@v4
        with:
          path: .coverage-tmp/ios-dd
          key: ios-dd-v1-${{ steps.xcode.outputs.version }}-${{ hashFiles('Package.swift') }}-${{ hashFiles('ios/**/*.swift') }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ios
          path: |
            coverage-summary/ios.json
            .coverage-tmp/ios-test.log
          if-no-files-found: ignore

  android:
    name: android (unit tests + coverage)
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Validates the committed wrapper jar. Its own cache is off: it only
      # saves on the default branch, so every PR run downloaded the Robolectric
      # android-all jar again and Maven Central answered 429.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      # Gradle's dependency cache (it holds the Robolectric android-all jar,
      # pinned in android/build.gradle.kts) and the wrapper distribution.
      # actions/cache saves on every branch; a PR also reads its base's cache.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      # android.sh validates the payloads the tests emit with contracts/scripts/validate.mjs.
      - run: npm --prefix contracts ci --no-audit --no-fund
      # The Robolectric jar alone, retried with a growing wait: Maven Central
      # rate-limits (429). A cache hit makes this a no-op.
      - name: Robolectric android-all jar (retried)
        working-directory: android
        run: |
          for attempt in 1 2 3 4; do
            ./gradlew syncRobolectricDeps && exit 0
            echo "syncRobolectricDeps failed (attempt $attempt); retrying in $((attempt * 30)) s"
            sleep $((attempt * 30))
          done
          exit 1
      # The Prebid fork resolves from maven.sellwild.com (settings.gradle.kts).
      - name: Unit tests with coverage (Kover)
        run: |
          rm -f coverage-summary/android.json
          bash scripts/coverage/android.sh
      - name: Coverage gate
        run: node tools/coverage-gate.mjs --only android
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-android
          path: |
            coverage-summary/android.json
            android/build/reports/kover/
            android/build/reports/tests/
          if-no-files-found: ignore
